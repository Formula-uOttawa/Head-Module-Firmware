<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN-harness Config</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #6a7385; --line: #dde1e8;
  --accent: #2a62d9; --accent-text: #ffffff; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030;
  --pin-analog: #cfe0ff; --pin-digital: #d9f2dd; --pin-gnd: #e3e5ea; --pin-5v: #ffe1c7; --pin-tc: #f3d9f7; --pin-none: #f0f1f4;
  --row-hover: #f1f4fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3; --line: #2d3340;
    --accent: #5b8cff; --accent-text: #0b1020; --ok: #4cc27f; --warn: #e0a84a; --bad: #ff7a7a;
    --pin-analog: #27406e; --pin-digital: #24492f; --pin-gnd: #2a2f3a; --pin-5v: #5a3a1c; --pin-tc: #4b2d52; --pin-none: #20242d;
    --row-hover: #232834;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3; --line: #2d3340;
  --accent: #5b8cff; --accent-text: #0b1020; --ok: #4cc27f; --warn: #e0a84a; --bad: #ff7a7a;
  --pin-analog: #27406e; --pin-digital: #24492f; --pin-gnd: #2a2f3a; --pin-5v: #5a3a1c; --pin-tc: #4b2d52; --pin-none: #20242d;
  --row-hover: #232834;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .path { color: var(--muted); font-size: 12px; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .sp { flex: 1; }
nav { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
main { padding: 12px 16px 48px; }
button.btn, select, input { font: inherit; color: var(--text); }
button.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.icon { padding: 2px 7px; }
input, select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[disabled], select[disabled] { opacity: .5; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar .sp { flex: 1; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.tablewrap { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 70vh; }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 12px; color: var(--muted); padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 2; }
td { padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:hover td { background: var(--row-hover); }
td.stat { position: sticky; left: 0; background: var(--panel); z-index: 1; width: 28px; text-align: center; }
tr.off td { opacity: .5; }
td input[type=number] { width: 68px; } td input.w-s { width: 52px; } td input.w-m { width: 110px; } td input.w-l { width: 170px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.issues { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.issues li { margin: 3px 0; } .issues .e { color: var(--bad); } .issues .w { color: var(--warn); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: 14px; }
.conn-grid { display: grid; grid-template-columns: repeat(17, minmax(34px, 1fr)); gap: 4px; }
.pin { border: 1px solid var(--line); border-radius: 6px; padding: 3px 2px; text-align: center; font-size: 11px; min-height: 48px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.pin b { font-size: 12px; } .pin span { color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin.analog, .pin.analog_tc_neg { background: var(--pin-analog); } .pin.digital { background: var(--pin-digital); }
.pin.gnd { background: var(--pin-gnd); } .pin.\35 v { background: var(--pin-5v); } .pin.tc_neg { background: var(--pin-tc); } .pin.none { background: var(--pin-none); }
.pin.used { outline: 2px solid var(--accent); outline-offset: -1px; } .pin.click { cursor: pointer; }
.picker { min-width: 78px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; cursor: pointer; font: inherit; color: var(--text); }
.picker[disabled] { opacity: .5; cursor: default; }
.picker small, .pmenu small { color: var(--muted); font-size: 11px; margin-left: 4px; }
.pmenu { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-height: 280px; overflow: auto; min-width: 150px; padding: 3px; }
.pmenu button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 4px 8px; color: var(--text); font: inherit; cursor: pointer; }
.pmenu button:hover, .pmenu button.on { background: var(--row-hover); }
.pmenu button.used { opacity: .55; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }
.bytes { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; max-width: 640px; }
.bytes div { height: 24px; font-size: 10px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid var(--line); color: #10131a; }
.bytes div.ts { background: var(--pin-gnd); color: var(--muted); } .bytes div.free { background: var(--panel); color: var(--muted); }
.bytes div.beyond { opacity: .25; background: var(--panel); color: var(--muted); }
.bar { height: 10px; background: var(--pin-none); border-radius: 5px; overflow: hidden; max-width: 420px; }
.bar > div { height: 100%; background: var(--ok); } .bar.warn > div { background: var(--warn); } .bar.bad > div { background: var(--bad); }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.cols { display: grid; grid-template-columns: 220px 1fr; gap: 12px; }
@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
.list button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 8px; color: var(--text); cursor: pointer; font: inherit; }
.list button.on { background: var(--row-hover); font-weight: 600; }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: center; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; max-width: min(720px, 94vw); }
dialog::backdrop { background: rgba(0,0,0,.4); }
textarea { width: 100%; min-height: 160px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-family: ui-monospace, Menlo, monospace; }
.muted { color: var(--muted); }
svg text { fill: var(--muted); font-size: 11px; }
header.dev-ok { background: color-mix(in srgb, var(--ok) 16%, var(--panel)); border-bottom-color: var(--ok); }
header.dev-slow, header.dev-wait { background: color-mix(in srgb, var(--warn) 16%, var(--panel)); border-bottom-color: var(--warn); }
header.dev-lost { background: color-mix(in srgb, var(--bad) 16%, var(--panel)); border-bottom-color: var(--bad); }
#devChip { cursor: pointer; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, 90vw); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 6px; padding: 8px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13px; word-break: break-word; }
.toast.error { border-left-color: var(--bad); } .toast.ok { border-left-color: var(--ok); } .toast b { color: var(--muted); }
.console { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; height: 240px; overflow: auto; padding: 6px 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
.cl { white-space: pre-wrap; word-break: break-word; }
.cl.error { color: var(--bad); } .cl.ok { color: var(--ok); } .cl.warn { color: var(--warn); } .cl.cmd { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>CAN-harness Config</h1>
  <span class="path" id="path"></span>
  <span class="sp"></span>
  <span class="chip" id="devChip" title="Open the Device tab"></span>
  <span class="chip" id="issueChip"></span>
  <span class="chip" id="saveChip"></span>
  <button class="btn primary" id="genBtn">Generate</button>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div id="toasts"></div>

<script>
"use strict";
// ---------- state ----------
let P = null, HW = null, A = { issues: [], frames: [], bus_load: 0 };
let tab = "channels", hubFilter = "all", search = "", selCal = null, selRx = 0;
const TABS = [["channels", "Channels"], ["rx", "CAN receive"], ["tx", "CAN transmit"], ["connectors", "Connectors"], ["frames", "Frames & bus load"], ["calibration", "Calibration"], ["system", "Hubs & settings"], ["device", "Device"]];
const TYPES = ["resistive", "active", "thermocouple", "digital"];

// ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "value") value = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  if (value !== undefined) e.value = value ?? "";
  return e;
}
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    let detail = j.detail;
    if (!detail || (r.status === 404 && detail === "Not Found"))
      detail = `HTTP ${r.status} from ${method} ${url}` + (r.status === 404 && url.startsWith("/api/")
        ? " - the web server is older than this page; restart it (python -m canharness.web)" : "");
    throw Object.assign(new Error("request failed"), { detail });
  }
  return j;
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const hex = (n, d = 8) => "0x" + n.toString(16).toUpperCase().padStart(d, "0");
const num = v => v === "" || v == null ? null : Number(v);
const hubName = id => (P.hubs.find(x => x.hub_id === id) || {}).name || `Hub ${id}`;
const chColor = id => `hsl(${(id * 47) % 360} 60% 68%)`;
function idBits(id) {
  const b = id.toString(2).padStart(29, "0");
  return [b.slice(0, 2), b.slice(2, 5), b.slice(5, 8), b.slice(8, 13), b.slice(13, 21), b.slice(21)].join(" ");
}

// ---------- persistence / analysis ----------
function setSave(s) { const c = document.getElementById("saveChip"); c.textContent = s; c.className = "chip " + (s === "Saved" ? "ok" : s === "Save failed" ? "bad" : "warn"); }
const save = debounce(async () => {
  try { await api("PUT", "/api/project", P); setSave("Saved"); } catch (e) { setSave("Save failed"); }
}, 500);
const analyze = debounce(async () => {
  try { A = await api("POST", "/api/analyze", P); } catch (e) { return; }
  updateStatus();
  if (tab === "frames") renderView();
}, 150);
function changed(structural) {
  setSave("Unsaved"); save(); analyze();
  if (structural) render();
}
function issuesFor(ch) { return A.issues.filter(i => i.where === ch.short_name); }
function updateStatus() {
  const e = A.issues.filter(i => i.level === "error").length, w = A.issues.length - e;
  const c = document.getElementById("issueChip");
  c.textContent = e ? `${e} error${e > 1 ? "s" : ""}` + (w ? `, ${w} warning${w > 1 ? "s" : ""}` : "") : w ? `${w} warning${w > 1 ? "s" : ""}` : "No issues";
  c.className = "chip " + (e ? "bad" : w ? "warn" : "ok");
  document.querySelectorAll("[data-sn]").forEach(el => {
    const ch = P.channels.find(x => x.channel_id === +el.dataset.cid); if (!ch) return;
    const is = issuesFor(ch);
    el.className = "dot" + (is.some(i => i.level === "error") ? " bad" : is.length ? " warn" : "");
    el.title = is.length ? is.map(i => i.message).join("\n") : "OK";
  });
  const box = document.getElementById("issueBox"); if (box) box.replaceWith(issueBox());
}
function issueBox() {
  const list = A.issues;
  return h("div", { class: "issues", id: "issueBox" }, list.length
    ? h("ul", { style: "margin:0;padding-left:18px" }, list.map(i => h("li", { class: i.level[0] }, `[${i.where}] ${i.message}`)))
    : h("span", { class: "muted" }, "No validation issues."));
}

// ---------- channels tab ----------
function newChannel(over = {}) {
  const id = Math.max(0, ...P.channels.map(c => c.channel_id)) + 1;
  const hub = "hub" in over ? over.hub : (hubFilter !== "all" ? +hubFilter : (P.hubs[0] || {}).hub_id ?? 0);
  return Object.assign({
    channel_id: id, name: "New channel", short_name: `CH${id}`, source: "hub", hub, sensor_type: "active", sample_rate_hz: 100,
    units: "", scaling: { gain: 1, offset: 0 }, fault_low: null, fault_high: null, pin_sig_pos: null, pin_sig_neg: null,
    pin_5v: null, pin_gnd: null, pin_gnd_connector: 2, cal_x: [], cal_y: [], raw_bytes: 3, signed: true,  // analog hub channels carry the raw 24-bit signed ADC code
    frame_idx: null, byte_offset: null, enabled: true, notes: "",
  }, over);
}
function freePin(hub, type) {
  const used = new Set(P.channels.filter(c => c.hub === hub && c.pin_sig_pos != null).map(c => c.pin_sig_pos));
  return HW.conn1.find(p => !used.has(p.pin) && (type === "digital" ? p.role === "digital" : p.role === "analog"))?.pin ?? null;
}
function pinChoices(ch) {
  const used = new Set(P.channels.filter(c => c !== ch && c.hub === ch.hub && c.pin_sig_pos != null).map(c => c.pin_sig_pos));
  const ok = p => ch.sensor_type === "digital" ? p.role === "digital"
    : ch.sensor_type === "thermocouple" ? p.afe === "B" && p.index <= 5 && p.pin !== 20
    : p.role === "analog" || p.role === "analog_tc_neg";
  return HW.conn1.filter(ok).map(p => ({ pin: p.pin, sub: p.afe ? `AFE ${p.afe}${p.index}` : `DIN${p.index}`, used: used.has(p.pin) }));
}
// Pin picker: pin number is the name, the AFE input is small grey text. Custom menu (a <select> can't style part of an option).
let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("scroll", e => { if (!(openMenu && openMenu.contains(e.target))) closeMenu(); }, true);
function pinPicker(current, choices, onPick, disabled) {
  const sel = choices.find(c => c.pin === current);
  const btn = h("button", { class: "picker", disabled, type: "button", onclick: e => {
    e.stopPropagation(); const wasOpen = openMenu && openMenu._owner === btn; closeMenu(); if (wasOpen) return;
    const pick = pin => { closeMenu(); onPick(pin); };
    const r = btn.getBoundingClientRect(), m = h("div", { class: "pmenu", onclick: ev => ev.stopPropagation() },
      h("button", { onclick: () => pick(null) }, "—"),
      choices.map(c => h("button", { class: (c.pin === current ? "on " : "") + (c.used ? "used" : ""), onclick: () => pick(c.pin) }, h("b", {}, c.pin), h("small", {}, c.sub + (c.used ? " · used" : "")))));
    m.style.left = Math.min(r.left, window.innerWidth - 170) + "px";
    m.style.top = (r.bottom + 2 + 280 > window.innerHeight ? Math.max(4, r.top - 282) : r.bottom + 2) + "px";
    m._owner = btn; document.body.append(m); openMenu = m;
  } }, current == null ? h("span", { class: "muted" }, "—") : [h("b", {}, current), sel ? h("small", {}, sel.sub) : null]);
  return btn;
}

function cellInput(ch, key, o = {}) {
  const el = h("input", { type: o.text ? "text" : "number", step: o.step ?? "any", class: o.cls || "", value: ch[key] ?? "", disabled: o.disabled,
    onchange: e => { ch[key] = o.text ? e.target.value : (o.int ? (num(e.target.value) == null ? null : Math.round(num(e.target.value))) : num(e.target.value)); changed(!!o.structural); } });
  return el;
}
function cellSelect(ch, key, opts, o = {}) {
  return h("select", { value: ch[key] ?? "", disabled: o.disabled,
    onchange: e => { const v = e.target.value; ch[key] = v === "" ? null : (o.str ? v : Number(v)); if (o.after) o.after(ch); changed(true); } },
    h("option", { value: "" }, "—"), opts);
}
function channelRow(ch) {
  const isHub = ch.source === "hub";
  const tr = h("tr", { class: ch.enabled ? "" : "off" },
    h("td", { class: "stat" }, h("span", { class: "dot", "data-sn": 1, "data-cid": ch.channel_id })),
    h("td", {}, h("input", { type: "checkbox", checked: ch.enabled, onchange: e => { ch.enabled = e.target.checked; changed(true); } })),
    h("td", {}, ch.channel_id),
    h("td", {}, cellInput(ch, "name", { text: true, cls: "w-l" })),
    h("td", {}, cellInput(ch, "short_name", { text: true, cls: "w-m", structural: true })),
    h("td", {}, h("select", { value: ch.hub ?? "", disabled: !isHub, onchange: e => { ch.hub = +e.target.value; changed(true); } },
      P.hubs.map(x => h("option", { value: x.hub_id }, `${x.hub_id} · ${x.name}`)))),
    h("td", {}, h("select", { value: ch.sensor_type, disabled: !isHub, onchange: e => {
        ch.sensor_type = e.target.value;
        if (ch.sensor_type === "thermocouple") { ch.pin_sig_neg = 20; ch.pin_sig_pos = null; } else ch.pin_sig_neg = null;
        if (ch.sensor_type === "digital") { ch.pin_sig_pos = freePin(ch.hub, "digital"); ch.raw_bytes = 1; ch.signed = false; }
        else if (ch.raw_bytes < 3 || !ch.signed) { ch.raw_bytes = 3; ch.signed = true; }  // analog: raw 24-bit two's complement
        changed(true); } }, (isHub ? TYPES : ["can"]).map(t => h("option", { value: t }, t)))),
    h("td", {}, h("select", { value: ch.sample_rate_hz, onchange: e => { ch.sample_rate_hz = +e.target.value; changed(false); } },
      HW.rate_codes.map(r => h("option", { value: r }, `${r} Hz`)))),
    h("td", {}, cellInput(ch, "units", { text: true, cls: "w-s" })),
    h("td", {}, pinPicker(ch.pin_sig_pos, pinChoices(ch), pin => { ch.pin_sig_pos = pin; changed(true); }, !isHub)),
    h("td", {}, ch.sensor_type === "thermocouple"
      ? pinPicker(ch.pin_sig_neg, HW.tc_neg_pins.map(p => ({ pin: p, sub: "TC−", used: false })), pin => { ch.pin_sig_neg = pin; changed(true); }, false)
      : h("span", { class: "muted" }, "GND")),
    h("td", {}, cellSelect(ch, "pin_5v", Array.from({ length: 17 }, (_, i) => h("option", { value: i + 1 }, `C2-${i + 1}`)))),
    h("td", {}, h("select", { value: ch.pin_gnd == null ? "" : `${ch.pin_gnd_connector}:${ch.pin_gnd}`, onchange: e => {
        const v = e.target.value; if (!v) ch.pin_gnd = null; else { const [c, p] = v.split(":"); ch.pin_gnd_connector = +c; ch.pin_gnd = +p; } changed(false); } },
      h("option", { value: "" }, "—"),
      [[1, [25, 30, 31, 32, 33, 34]], [2, Array.from({ length: 17 }, (_, i) => i + 18)]].flatMap(([c, ps]) => ps.map(p => h("option", { value: `${c}:${p}` }, `C${c}-${p}`))))),
    h("td", {}, h("select", { value: ch.raw_bytes, disabled: !isHub, onchange: e => { ch.raw_bytes = +e.target.value; changed(false); } }, [1, 2, 3, 4].map(n => h("option", { value: n }, n)))),
    h("td", {}, cellInput(ch, "frame_idx", { int: true, cls: "w-s", disabled: !isHub })),
    h("td", {}, cellInput(ch, "byte_offset", { int: true, cls: "w-s", disabled: !isHub })),
    h("td", {}, cellInput(ch, "fault_low")),
